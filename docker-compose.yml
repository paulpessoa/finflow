version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finflow_db
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finflow123}
      POSTGRES_DB: finflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finflow_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finflow:${DB_PASSWORD:-finflow123}@postgres:5432/finflow_db
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-supersecret_prod}
      NODE_ENV: production
      FRONTEND_URL: http://localhost:4000
    ports:
      - "3001:3001"

  htmx:
    build:
      context: ./htmx
      dockerfile: Dockerfile
    container_name: finflow_htmx
    depends_on:
      - backend
    environment:
      API_URL: http://backend:3001/api
      PORT: 3000
      NODE_ENV: production
    ports:
      - "4000:3000"

volumes:
  postgres_data:
